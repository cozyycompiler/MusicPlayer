<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #05000d;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width, height;
let dots = [];

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    createHeart();
}

window.addEventListener("resize", resize);


// Create random starting positions
function randomPosition() {
    return {
        x: Math.random() * width,
        y: Math.random() * height
    };
}


// Heart equation
function heartPoint(t, scale) {

    let x = 16 * Math.pow(Math.sin(t), 3);

    let y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: width / 2 + x * scale,
        y: height / 2 - y * scale
    };
}


// Create heart dots
function createHeart() {

    dots = [];

    let count = 1600;

    let scale =
        Math.min(width, height) / 42;

    for (let i = 0; i < count; i++) {

        let start = randomPosition();

        let t =
            Math.random() * Math.PI * 2;

        let target = heartPoint(t, scale);

        // Make the heart thicker
        target.x +=
            (Math.random() - 0.5) * 12;

        target.y +=
            (Math.random() - 0.5) * 12;

        dots.push({

            x: start.x,
            y: start.y,

            targetX: target.x,
            targetY: target.y,

            size:
                Math.random() * 2.5 + 0.5,

            speed:
                Math.random() * 0.025 + 0.01,

            phase:
                Math.random() * Math.PI * 2,

            color:
                Math.random() > 0.5
                ? "#ff4f9a"
                : "#ff9fc8"
        });
    }
}


// Background
function drawBackground() {

    let gradient =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            20,
            width / 2,
            height / 2,
            height
        );

    gradient.addColorStop(
        0,
        "#26001f"
    );

    gradient.addColorStop(
        0.5,
        "#100014"
    );

    gradient.addColorStop(
        1,
        "#020006"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


// Heart glow
function drawGlow() {

    let gradient =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            20,
            width / 2,
            height / 2,
            height * 0.4
        );

    gradient.addColorStop(
        0,
        "rgba(255,40,130,0.12)"
    );

    gradient.addColorStop(
        0.5,
        "rgba(255,30,100,0.05)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,0,80,0)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


// Draw dots
function drawDots(time) {

    for (let dot of dots) {

        // Move toward heart
        dot.x +=
            (dot.targetX - dot.x)
            * dot.speed;

        dot.y +=
            (dot.targetY - dot.y)
            * dot.speed;

        // Slight floating movement
        let floatX =
            Math.sin(
                time * 0.001 +
                dot.phase
            ) * 0.5;

        let floatY =
            Math.cos(
                time * 0.001 +
                dot.phase
            ) * 0.5;

        ctx.beginPath();

        ctx.arc(
            dot.x + floatX,
            dot.y + floatY,
            dot.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = dot.color;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff4f9a";

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}


// Background particles
let particles = [];

for (let i = 0; i < 100; i++) {

    particles.push({

        x: Math.random() * window.innerWidth,

        y: Math.random() * window.innerHeight,

        size:
            Math.random() * 1.5,

        speed:
            Math.random() * 0.4 + 0.1
    });
}


function drawParticles() {

    for (let p of particles) {

        p.y -= p.speed;

        if (p.y < 0)
            p.y = height;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,150,200,0.6)";

        ctx.fill();
    }
}


// Animation
function animate(time) {

    drawBackground();

    drawGlow();

    drawParticles();

    drawDots(time);

    requestAnimationFrame(animate);
}

resize();

animate(0);

</script>

</body>
</html>
